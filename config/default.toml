# B.O.B. — default configuration (committed).
#
# Do NOT edit this file for personal settings. Copy the keys you want into
# config/user.toml, which is gitignored and overrides everything here.
# Secrets never belong in either file — use .env.

[app]
name = "B.O.B."
tagline = "Beyond Orbit Buddy"
language = "el"
start_minimized = false
autostart_with_windows = false

[logging]
level = "INFO"
console = true
json_files = true

# ---------------------------------------------------------------------------
# Providers. "mock" everywhere in Phase 0 — each phase flips one of these over
# to a real implementation without touching a line of application code.
# ---------------------------------------------------------------------------

[llm]
provider = "mock"        # -> "ollama" in Phase 3
model = "qwen2.5:14b-instruct"
host = "http://localhost:11434"
temperature = 0.7
max_tokens = 1024
stream = true

[stt]
provider = "faster-whisper"
# PROVISIONAL. Do not treat this as a considered choice: run
#   python -m bob benchmark-stt --samples <dir>
# on your own machine and set this from the results. See docs/BENCHMARK.md.
model = "large-v3-turbo"
language = "el"          # pinned; auto-detect mishandles Greek + English app names
compute_type = "auto"    # int8 on CPU, float16 on GPU
device = "auto"
beam_size = 5
emit_partials = false

[tts]
provider = "mock"        # -> "piper" (or alternative) in Phase 4
voice = "el_GR-default"
speed = 1.0
volume = 1.0

[vad]
provider = "silero"      # silero | energy (fallback, noisy) | mock
threshold = 0.5
min_speech_ms = 250      # ignores coughs, clicks and door slams
end_silence_ms = 700     # long enough to survive a mid-sentence pause
pre_roll_ms = 320        # keeps the first syllable when VAD triggers late
max_utterance_s = 20.0

[wakeword]
provider = "mock"        # -> "openwakeword" in Phase 5
enabled = true
keywords = ["bob", "μπομπ"]
threshold = 0.6

[memory]
provider = "mock"        # -> "sqlite" in Phase 7
short_term_turns = 20
long_term_enabled = true
# Deliberately false: long-term memory is something the user asks for,
# not a transcript of every conversation.
autosave_conversations = false

[vision]
provider = "mock"        # -> "ollama-vision" in Phase 8
enabled = true
max_edge_px = 1280

[audio]
# input_device = "Blue Yeti"   # a NAME or substring, never an index
sample_rate = 16000
frame_ms = 32.0          # 512 samples: Silero's native block size
channels = 1
level_update_hz = 20.0   # rate limit for the core animation
error_recovery_s = 2.5

# B.O.B. does not record you. This exists only for building benchmark samples.
retain_recordings = false

allow_barge_in = true
barge_in_threshold_ms = 250

[personality]
persona = "bob"
humor = 0.4
formality = 0.2
verbosity = "normal"

# ---------------------------------------------------------------------------
# Security. This is the boundary that protects the machine.
# `high` may never be set to "allow" — the config schema rejects it.
# ---------------------------------------------------------------------------

[security]
audit_enabled = true
confirmation_timeout_s = 30.0
tool_timeout_s = 30.0
redact_keys = ["password", "token", "secret", "api_key", "pin"]
blocked_tools = []

[security.policy]
low = "allow"
medium = "confirm"
high = "confirm"

[ui]
theme = "orbit-dark"
accent = "#4FD9E8"
show_system_panel = true
show_conversation = true
animation_fps = 60
reduced_motion = false
always_on_top = false
