[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bob-assistant"
version = "0.1.0"
description = "B.O.B. — Beyond Orbit Buddy. A local-first Greek-speaking desktop AI companion."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Montarx" }]

# Phase 0 runtime dependencies are deliberately tiny.
# Heavy dependencies (Qt, whisper, audio, ONNX) arrive with the phase that needs them.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
# Phase 1 — desktop shell + sci-fi UI
ui = ["PySide6>=6.7"]
# Phase 2 — microphone + speech-to-text
stt = ["sounddevice>=0.4.7", "numpy>=1.26", "faster-whisper>=1.0"]
# Phase 3 — local brain
llm = ["httpx>=0.27"]
# Phase 4/5 — speech output + wake word
speech = ["piper-tts>=1.2"]
wake = ["openwakeword>=0.6", "onnxruntime>=1.18"]
# Phase 6 — Windows control
win = ["psutil>=5.9", "pywin32>=306; sys_platform == 'win32'", "pyautogui>=0.9.54"]
# Phase 7 — memory
memory = ["sqlite-vec>=0.1.1"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
bob = "bob.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bob"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:bob.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
    "E501",
    # B.O.B. speaks Greek. Greek letters in strings and comments are the point,
    # not a homoglyph attack, so the "ambiguous unicode" rules are noise here.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
packages = ["bob"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
