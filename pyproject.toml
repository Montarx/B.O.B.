[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bob-assistant"
version = "0.1.0"
description = "B.O.B. — Beyond Orbit Buddy. A local-first Greek-speaking desktop AI companion."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Montarx" }]

# Phase 0 runtime dependencies are deliberately tiny.
# Heavy dependencies (Qt, whisper, audio, ONNX) arrive with the phase that needs them.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
# Phase 1 — desktop shell + sci-fi UI
ui = ["PySide6>=6.7"]
# Phase 2 — microphone, VAD and speech-to-text.
# Grouped so a minimal install stays small: B.O.B. starts without these and
# tells you the microphone is unavailable rather than refusing to launch.
voice = [
    "sounddevice>=0.5",      # PortAudio bindings; the wheel bundles PortAudio
    "numpy>=1.26",
    "onnxruntime>=1.18",     # runs Silero VAD without pulling in torch
    "faster-whisper>=1.0",   # CTranslate2 Whisper; releases the GIL
]
# Phase 3 — local brain
llm = ["httpx>=0.27"]
# Phase 4/5 — speech output + wake word
speech = ["piper-tts>=1.2"]
wake = ["openwakeword>=0.6", "onnxruntime>=1.18"]
# Phase 6 — Windows control
win = ["psutil>=5.9", "pywin32>=306; sys_platform == 'win32'", "pyautogui>=0.9.54"]
# Phase 7 — memory
memory = ["sqlite-vec>=0.1.1"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Everything, for development.
all = [
    "PySide6>=6.7",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "faster-whisper>=1.0",
]

[project.scripts]
bob = "bob.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bob"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers -m 'not integration'"
markers = [
    "integration: needs real hardware or downloaded models; not run by default",
]
filterwarnings = ["error::DeprecationWarning:bob.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
    "E501",
    # B.O.B. speaks Greek. Greek letters in strings and comments are the point,
    # not a homoglyph attack, so the "ambiguous unicode" rules are noise here.
    "RUF001",
    "RUF002",
    "RUF003",
]

[[tool.mypy.overrides]]
# These ship no stubs and no py.typed marker. Scoped deliberately rather than
# using a global ignore_missing_imports, so a genuinely missing import in our
# own code still fails.
module = [
    "sounddevice.*",
    "onnxruntime.*",
    "faster_whisper.*",
    "ctranslate2.*",
    "psutil.*",
    "soundfile.*",
]
ignore_missing_imports = true

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
packages = ["bob"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
